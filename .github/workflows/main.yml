name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 10 */5 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Supabase
        run: |
          echo "🏓 Pinging Supabase..."
          curl -s -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" "${{ secrets.SUPABASE_URL }}/rest/v1/" || echo "Ping attempted"
          echo "✅ Done at $(date -u)"
