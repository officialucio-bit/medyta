name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 10 */5 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Supabase
        run: |
          echo "🏓 Pinging Supabase..."
          curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" || true
          echo "✅ Supabase ping completed at $(date -u)"
          echo "✅ Supabase ping completed at $(date -u)
